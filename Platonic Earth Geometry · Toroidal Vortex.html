<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platonic Earth · Toroidal Vortex</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0f;
            overflow: hidden;
            cursor: default;
            font-family: 'Segoe UI', sans-serif;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* ── ENTRY BUTTON ── */
        .entry-btn {
            position: fixed;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            background: rgba(10, 10, 15, 0.85);
            border: 2px solid #c8a04e;
            border-radius: 60px;
            padding: 16px 40px;
            color: #c8a04e;
            font-size: 0.9rem;
            letter-spacing: 8px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.6s ease;
            font-family: 'Courier New', monospace;
            backdrop-filter: blur(12px);
            box-shadow: 0 0 40px rgba(200, 160, 78, 0.1);
            text-align: center;
            pointer-events: auto;
        }
        .entry-btn:hover {
            background: rgba(200, 160, 78, 0.15);
            box-shadow: 0 0 60px rgba(200, 160, 78, 0.3);
            transform: translateX(-50%) scale(1.05);
        }
        .entry-btn.hidden {
            opacity: 0;
            pointer-events: none;
            transform: translateX(-50%) scale(0.8);
        }
        .entry-btn .icon {
            font-size: 1.5rem;
            display: block;
            margin-bottom: 4px;
        }
        .entry-btn .sub {
            font-size: 0.5rem;
            letter-spacing: 3px;
            color: #8a7a5a;
            display: block;
            margin-top: 2px;
        }

        @media (max-width: 768px) {
            .entry-btn {
                padding: 12px 24px;
                font-size: 0.7rem;
                letter-spacing: 4px;
                bottom: 30px;
            }
            .entry-btn .icon {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>

<div id="canvas-container"></div>

<!-- ── ENTRY BUTTON ── -->
<button class="entry-btn" id="entryBtn">
    <span class="icon">⬡</span>
    Enter the Vortex
    <span class="sub">Platonic Earth · Toroidal Descent</span>
</button>

<script>
    // ═══════════════════════════════════════════════════════════════
    // PLATONIC EARTH — TOROIDAL VORTEX
    // Clean 3D visualization — no text, no faces panel
    // ═══════════════════════════════════════════════════════════════

    // ── THREE.JS SETUP ──
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a0f);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 8);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = 2;
    controls.maxDistance = 20;
    controls.autoRotate = false;

    // ── LIGHTING ──
    const ambient = new THREE.AmbientLight(0x404060, 0.3);
    scene.add(ambient);

    const main = new THREE.DirectionalLight(0xc8a04e, 1.2);
    main.position.set(5, 5, 5);
    scene.add(main);

    const rim = new THREE.DirectionalLight(0x4a9eff, 0.6);
    rim.position.set(-5, -3, -5);
    scene.add(rim);

    const point = new THREE.PointLight(0xc8a04e, 0.8, 20);
    point.position.set(0, 0, 0);
    scene.add(point);

    // ── STARFIELD ──
    const starGeo = new THREE.BufferGeometry();
    const starCount = 4000;
    const starPos = new Float32Array(starCount * 3);
    const starSizes = new Float32Array(starCount);
    for (let i = 0; i < starCount * 3; i++) {
        starPos[i] = (Math.random() - 0.5) * 120;
        if (i % 3 === 0) starSizes[Math.floor(i / 3)] = 0.02 + Math.random() * 0.04;
    }
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    const starMat = new THREE.PointsMaterial({
        color: 0xc8c0a8,
        size: 0.04,
        transparent: true,
        opacity: 0.5,
        blending: THREE.AdditiveBlending
    });
    const stars = new THREE.Points(starGeo, starMat);
    scene.add(stars);

    // ── ICOSAHEDRON (16-Face Coherence Sphere) ──
    const icoGeo = new THREE.IcosahedronGeometry(2.2, 1);
    const icoMat = new THREE.MeshPhysicalMaterial({
        color: 0x1a1a2e,
        metalness: 0.8,
        roughness: 0.3,
        clearcoat: 0.6,
        clearcoatRoughness: 0.2,
        emissive: 0x0a0a1a,
        emissiveIntensity: 0.3,
        transparent: true,
        opacity: 0.9,
        wireframe: false
    });
    const icosahedron = new THREE.Mesh(icoGeo, icoMat);
    icosahedron.castShadow = true;
    scene.add(icosahedron);

    // Wireframe overlay
    const wireGeo = new THREE.WireframeGeometry(icoGeo);
    const wireMat = new THREE.LineBasicMaterial({
        color: 0xc8a04e,
        transparent: true,
        opacity: 0.12
    });
    const wireframe = new THREE.LineSegments(wireGeo, wireMat);
    icosahedron.add(wireframe);

    // ── PLATONIC SOLIDS (floating inside) ──
    const solidData = [
        { geo: new THREE.TetrahedronGeometry(0.3), color: 0xe74c3c, pos: [0.8, 0.8, 0.8] },
        { geo: new THREE.OctahedronGeometry(0.3), color: 0x3498db, pos: [-0.8, 0.6, -0.8] },
        { geo: new THREE.BoxGeometry(0.35, 0.35, 0.35), color: 0xf1c40f, pos: [0.6, -0.9, 0.5] },
        { geo: new THREE.DodecahedronGeometry(0.28), color: 0x9b59b6, pos: [-0.9, -0.5, -0.6] },
        { geo: new THREE.IcosahedronGeometry(0.28), color: 0x1abc9c, pos: [0, 0, 1.2] }
    ];

    const solids = solidData.map(d => {
        const mat = new THREE.MeshPhysicalMaterial({
            color: d.color,
            metalness: 0.7,
            roughness: 0.2,
            emissive: d.color,
            emissiveIntensity: 0.2,
            transparent: true,
            opacity: 0.8
        });
        const mesh = new THREE.Mesh(d.geo, mat);
        mesh.position.set(d.pos[0], d.pos[1], d.pos[2]);
        mesh.castShadow = true;
        scene.add(mesh);
        return mesh;
    });

    // ── VORTEX PARTICLES ──
    const vCount = 1500;
    const vGeo = new THREE.BufferGeometry();
    const vPos = new Float32Array(vCount * 3);
    const vCol = new Float32Array(vCount * 3);
    for (let i = 0; i < vCount; i++) {
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        const r = 2.5 + Math.random() * 4;
        vPos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
        vPos[i * 3 + 1] = (Math.random() - 0.5) * 10;
        vPos[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
        const c = new THREE.Color().setHSL(0.1 + Math.random() * 0.08, 0.7, 0.3 + Math.random() * 0.3);
        vCol[i * 3] = c.r;
        vCol[i * 3 + 1] = c.g;
        vCol[i * 3 + 2] = c.b;
    }
    vGeo.setAttribute('position', new THREE.BufferAttribute(vPos, 3));
    vGeo.setAttribute('color', new THREE.BufferAttribute(vCol, 3));
    const vMat = new THREE.PointsMaterial({
        size: 0.07,
        transparent: true,
        opacity: 0.3,
        blending: THREE.AdditiveBlending,
        vertexColors: true
    });
    const vortex = new THREE.Points(vGeo, vMat);
    vortex.visible = false;
    scene.add(vortex);

    // ── RING LINES ──
    const ringMat = new THREE.LineBasicMaterial({
        color: 0xc8a04e,
        transparent: true,
        opacity: 0.08
    });
    for (let i = 0; i < 8; i++) {
        const r = 2.8 + i * 0.3;
        const points = [];
        for (let j = 0; j <= 64; j++) {
            const a = (j / 64) * Math.PI * 2;
            points.push(new THREE.Vector3(
                r * Math.cos(a),
                Math.sin(a * 0.5 + i) * 0.3,
                r * Math.sin(a)
            ));
        }
        const geo = new THREE.BufferGeometry().setFromPoints(points);
        const line = new THREE.Line(geo, ringMat);
        scene.add(line);
    }

    // ── ENTRY ──
    const entryBtn = document.getElementById('entryBtn');
    let entered = false;

    entryBtn.addEventListener('click', () => {
        if (entered) return;
        entered = true;
        entryBtn.classList.add('hidden');
        vortex.visible = true;

        // Start auto-rotation
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.5;

        // Camera zoom in
        const startPos = { z: 8 };
        const targetPos = { z: 4 };
        let progress = 0;
        const zoomInterval = setInterval(() => {
            progress += 0.02;
            camera.position.z = startPos.z + (targetPos.z - startPos.z) * Math.min(progress, 1);
            controls.update();
            if (progress >= 1) clearInterval(zoomInterval);
        }, 16);
    });

    // ── RESIZE ──
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ── ANIMATION ──
    const clock = new THREE.Clock();

    function animate() {
        requestAnimationFrame(animate);
        const t = clock.getElapsedTime();

        // Icosahedron pulse
        const pulse = 1 + Math.sin(t * 0.4) * 0.015;
        icosahedron.scale.set(pulse, pulse, pulse);

        // Star rotation
        stars.rotation.y = t * 0.015;
        stars.rotation.x = Math.sin(t * 0.01) * 0.05;

        // Solid rotation
        solids.forEach((s, i) => {
            s.rotation.x += 0.01 * (i + 1);
            s.rotation.y += 0.015 * (i + 1);
            s.rotation.z += 0.008 * (i + 1);
            // Float motion
            s.position.y += Math.sin(t * 0.5 + i * 1.2) * 0.001;
        });

        // Vortex particles
        if (vortex.visible) {
            const pos = vortex.geometry.attributes.position.array;
            for (let i = 0; i < pos.length / 3; i++) {
                const idx = i * 3;
                const r = Math.sqrt(pos[idx] * pos[idx] + pos[idx + 2] * pos[idx + 2]);
                const angle = Math.atan2(pos[idx + 2], pos[idx]) + 0.01;
                pos[idx] = r * Math.cos(angle);
                pos[idx + 2] = r * Math.sin(angle);
                pos[idx + 1] += (Math.sin(t * 0.3 + i * 0.01) * 0.002);
                // Keep within bounds
                if (pos[idx + 1] > 4) pos[idx + 1] = -4;
                if (pos[idx + 1] < -4) pos[idx + 1] = 4;
            }
            vortex.geometry.attributes.position.needsUpdate = true;
            vortex.rotation.y += 0.002;
            const opacity = 0.15 + Math.sin(t * 0.15) * 0.1 + 0.1;
            vortex.material.opacity = Math.min(opacity, 0.35);
        }

        // Ring lines
        const ringLines = scene.children.filter(c => c.isLine && c.material.color.getHex() === 0xc8a04e);
        ringLines.forEach((line, i) => {
            line.rotation.x += 0.001;
            line.rotation.y += 0.002 * (i + 1) * 0.3;
        });

        controls.update();
        renderer.render(scene, camera);
    }

    animate();

    console.log('✦ Platonic Earth — Toroidal Vortex');
    console.log('✦ Enter the Vortex to begin');
</script>

</body>
</html>
