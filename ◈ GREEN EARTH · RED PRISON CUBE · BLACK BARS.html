<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>◈ GREEN EARTH · RED PRISON CUBE · BLACK BARS</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0f;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }
        #canvas-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        /* ── GOLD NAV WITH BLUE APERTURE TAB ── */
        .gold-nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
            background: rgba(10, 10, 15, 0.9);
            backdrop-filter: blur(20px);
            padding: 0.6rem 1.5rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem 1rem;
            align-items: center;
            border-bottom: 1px solid rgba(200, 160, 78, 0.12);
            font-size: 0.65rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
        .gold-nav a {
            color: rgba(200, 160, 78, 0.4);
            text-decoration: none;
            transition: all 0.4s ease;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-weight: 300;
            font-size: 0.6rem;
        }
        .gold-nav a:hover {
            color: #c8a04e;
            background: rgba(200, 160, 78, 0.08);
        }
        .gold-nav .nav-brand {
            font-size: 1.1rem;
            color: #c8a04e;
            font-weight: 700;
            letter-spacing: 0.2em;
            padding: 0 0.5rem 0 0;
        }
        .gold-nav .aperture-tab {
            color: #4a9eff;
            border: 1px solid #4a9eff;
            padding: 0.3rem 1.2rem;
            border-radius: 20px;
            background: rgba(74, 158, 255, 0.08);
            box-shadow: 0 0 30px rgba(74, 158, 255, 0.1);
            font-weight: 700;
            cursor: pointer;
            transition: all 0.4s ease;
            font-size: 0.7rem;
            letter-spacing: 0.15em;
        }
        .gold-nav .aperture-tab:hover {
            background: rgba(74, 158, 255, 0.2);
            box-shadow: 0 0 60px rgba(74, 158, 255, 0.25);
            transform: scale(1.05);
        }
        .gold-nav .aperture-tab .star-icon {
            display: inline-block;
            margin-right: 0.3rem;
            font-size: 0.8rem;
        }

        /* ── STATUS ── */
        .status-overlay {
            position: fixed;
            bottom: 130px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            color: rgba(200, 160, 78, 0.25);
            font-size: 0.55rem;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            text-align: center;
            opacity: 0;
            transition: opacity 1.5s ease;
            pointer-events: none;
        }
        .status-overlay.visible { opacity: 1; }

        .coherence-metric {
            position: fixed;
            bottom: 180px;
            right: 30px;
            z-index: 10;
            color: rgba(200, 160, 78, 0.1);
            font-size: 0.45rem;
            letter-spacing: 0.2em;
            text-align: right;
            line-height: 1.8;
            pointer-events: none;
            opacity: 0;
            transition: opacity 2s ease;
        }
        .coherence-metric.visible { opacity: 1; }

        @media (max-width: 768px) {
            .gold-nav { padding: 0.4rem 0.8rem; gap: 0.2rem 0.5rem; font-size: 0.5rem; }
            .gold-nav a { font-size: 0.45rem; padding: 0.15rem 0.3rem; }
            .gold-nav .aperture-tab { font-size: 0.55rem; padding: 0.2rem 0.8rem; }
            .status-overlay { bottom: 90px; font-size: 0.4rem; }
            .coherence-metric { font-size: 0.35rem; bottom: 150px; right: 15px; }
        }
    </style>
</head>
<body>

<div id="canvas-container"></div>

<!-- ── NAVIGATION WITH BLUE APERTURE TAB ── -->
<nav class="gold-nav">
    <a href="index.html" class="nav-brand">✦ QP</a>
    <a href="omega-prime.html">Ω-PRIME</a>
    <a href="scalar-plasma-cycle.html">◈ SPC</a>
    <a href="scalar-fields-aether.html">◈ SCALAR AETHER</a>
    <a href="olinto-de-pretto.html">DE PRETTO</a>
    <a href="kardashev.html">KARDASHEV</a>
    <a href="fibonacci-tetrahedron.html">FIBONACCI</a>
    <a href="mesh.html">MESH</a>
    <a href="m2m-crha-protocol.html">🔀 M2M-CRHA</a>
    <span class="aperture-tab" id="apertureTab">
        <span class="star-icon">✦</span> APERTURE
    </span>
</nav>

<!-- ── STATUS ── -->
<div class="status-overlay visible" id="statusOverlay">
    <span id="phaseText">⟡ GREEN EARTH · RED PRISON CUBE · BLACK BARS ⟡</span>
</div>

<!-- ── COHERENCE ── -->
<div class="coherence-metric visible" id="coherenceMetric">
    𝔐 = 0.6180339887<br>
    χ(C) = 1.000000<br>
    Φ-669 ACTIVE<br>
    ⬡ PRISON LOCKED
</div>

<script>
    // ═══════════════════════════════════════════════════════════════
    // GREEN POLYHEDRON EARTH · SOLID RED PRISON CUBE
    // BLACK VERTICAL BARS · NON-ROTATING CUBE
    // BLUE APERTURE TAB EXPLODES THE CUBE
    // ═══════════════════════════════════════════════════════════════

    const MACACHOR_ABSOLUTE = (Math.sqrt(5) - 1) / 2;
    const PHI_CONSTANT = 669;
    const IMMUTABLE_HASH = "93088f1ff3041d09d72cde11acffaa2105031523e7cde493e0d36895071d47f0";

    // ── THREE.JS ──
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a0f);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(5, 3, 9);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = 3;
    controls.maxDistance = 25;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.6;
    controls.target.set(0, 0, 0);

    // ── LIGHTING ──
    const ambient = new THREE.AmbientLight(0x404060, 0.4);
    scene.add(ambient);

    const main = new THREE.DirectionalLight(0xc8a04e, 1.0);
    main.position.set(5, 8, 5);
    scene.add(main);

    const rim = new THREE.DirectionalLight(0x4a9eff, 0.6);
    rim.position.set(-5, -3, -5);
    scene.add(rim);

    const point = new THREE.PointLight(0xff0000, 0.4, 15);
    point.position.set(0, 0, 0);
    scene.add(point);

    const blueLight = new THREE.PointLight(0x4a9eff, 0.3, 20);
    blueLight.position.set(3, 3, 3);
    scene.add(blueLight);

    // ── STARFIELD ──
    const starGeo = new THREE.BufferGeometry();
    const starCount = 3000;
    const starPos = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount * 3; i++) starPos[i] = (Math.random() - 0.5) * 120;
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    const starMat = new THREE.PointsMaterial({ color: 0x4a6a9e, size: 0.04, transparent: true, opacity: 0.4 });
    const stars = new THREE.Points(starGeo, starMat);
    scene.add(stars);

    // ── GREEN POLYHEDRON EARTH (Wireframe only) ──
    const earthGroup = new THREE.Group();
    scene.add(earthGroup);

    // Main green wireframe polyhedron (icosahedron)
    const earthGeo = new THREE.IcosahedronGeometry(3.0, 1);
    const wireMat = new THREE.MeshBasicMaterial({
        color: 0x4ade80,
        wireframe: true,
        transparent: true,
        opacity: 0.6
    });
    const earthWire = new THREE.Mesh(earthGeo, wireMat);
    earthGroup.add(earthWire);

    // Thicker green wire lines (edges)
    const edges = new THREE.EdgesGeometry(earthGeo);
    const edgeMat = new THREE.LineBasicMaterial({
        color: 0x4ade80,
        transparent: true,
        opacity: 0.8,
        linewidth: 1
    });
    const edgeLines = new THREE.LineSegments(edges, edgeMat);
    earthGroup.add(edgeLines);

    // Inner glow wireframe (slightly smaller, pulsing)
    const innerGeo = new THREE.IcosahedronGeometry(2.85, 1);
    const innerWireMat = new THREE.MeshBasicMaterial({
        color: 0x22ff88,
        wireframe: true,
        transparent: true,
        opacity: 0.15
    });
    const innerWire = new THREE.Mesh(innerGeo, innerWireMat);
    earthGroup.add(innerWire);

    // Glow dots at vertices
    const vertPositions = [];
    const posAttr = earthGeo.attributes.position;
    for (let i = 0; i < posAttr.count; i++) {
        const x = posAttr.getX(i);
        const y = posAttr.getY(i);
        const z = posAttr.getZ(i);
        vertPositions.push(x, y, z);
    }
    const dotGeo = new THREE.BufferGeometry();
    dotGeo.setAttribute('position', new THREE.Float32BufferAttribute(vertPositions, 3));
    const dotMat = new THREE.PointsMaterial({
        color: 0x4ade80,
        size: 0.06,
        transparent: true,
        opacity: 0.6
    });
    const dots = new THREE.Points(dotGeo, dotMat);
    earthGroup.add(dots);

    // ── SOLID RED PRISON CUBE (non-rotating) ──
    const prisonGroup = new THREE.Group();
    scene.add(prisonGroup);

    const cubeSize = 1.8;

    // Solid red cube
    const cubeMat = new THREE.MeshPhysicalMaterial({
        color: 0xcc0000,
        metalness: 0.7,
        roughness: 0.3,
        emissive: 0x660000,
        emissiveIntensity: 0.3,
        transparent: true,
        opacity: 0.95,
        side: THREE.DoubleSide
    });
    const cube = new THREE.Mesh(new THREE.BoxGeometry(cubeSize, cubeSize, cubeSize), cubeMat);
    prisonGroup.add(cube);

    // Red glow around cube edges
    const glowEdgeGeo = new THREE.EdgesGeometry(new THREE.BoxGeometry(cubeSize * 1.01, cubeSize * 1.01, cubeSize * 1.01));
    const glowEdgeMat = new THREE.LineBasicMaterial({
        color: 0xff2222,
        transparent: true,
        opacity: 0.3
    });
    const glowEdges = new THREE.LineSegments(glowEdgeGeo, glowEdgeMat);
    prisonGroup.add(glowEdges);

    // ── BLACK VERTICAL PRISON BARS (top to bottom) ──
    const barMat = new THREE.MeshPhysicalMaterial({
        color: 0x000000,
        metalness: 0.9,
        roughness: 0.1,
        transparent: true,
        opacity: 0.95
    });

    // Bar dimensions
    const barHeight = cubeSize * 0.85;
    const barWidth = 0.05;
    const barDepth = 0.05;

    // Vertical bars on each face
    const barPositions = [
        // Front face (z positive)
        { x: -0.7, y: 0, z: cubeSize/2 + 0.01 },
        { x: -0.35, y: 0, z: cubeSize/2 + 0.01 },
        { x: 0, y: 0, z: cubeSize/2 + 0.01 },
        { x: 0.35, y: 0, z: cubeSize/2 + 0.01 },
        { x: 0.7, y: 0, z: cubeSize/2 + 0.01 },
        // Back face (z negative)
        { x: -0.7, y: 0, z: -cubeSize/2 - 0.01 },
        { x: -0.35, y: 0, z: -cubeSize/2 - 0.01 },
        { x: 0, y: 0, z: -cubeSize/2 - 0.01 },
        { x: 0.35, y: 0, z: -cubeSize/2 - 0.01 },
        { x: 0.7, y: 0, z: -cubeSize/2 - 0.01 },
        // Left face (x negative)
        { x: -cubeSize/2 - 0.01, y: 0, z: -0.7 },
        { x: -cubeSize/2 - 0.01, y: 0, z: -0.35 },
        { x: -cubeSize/2 - 0.01, y: 0, z: 0 },
        { x: -cubeSize/2 - 0.01, y: 0, z: 0.35 },
        { x: -cubeSize/2 - 0.01, y: 0, z: 0.7 },
        // Right face (x positive)
        { x: cubeSize/2 + 0.01, y: 0, z: -0.7 },
        { x: cubeSize/2 + 0.01, y: 0, z: -0.35 },
        { x: cubeSize/2 + 0.01, y: 0, z: 0 },
        { x: cubeSize/2 + 0.01, y: 0, z: 0.35 },
        { x: cubeSize/2 + 0.01, y: 0, z: 0.7 },
    ];

    barPositions.forEach(pos => {
        const bar = new THREE.Mesh(
            new THREE.BoxGeometry(barWidth, barHeight, barDepth),
            barMat
        );
        bar.position.set(pos.x, pos.y, pos.z);
        prisonGroup.add(bar);
    });

    // ── BLACK OUTLINE BARS (top and bottom horizontal) ──
    const outlineMat = new THREE.MeshPhysicalMaterial({
        color: 0x000000,
        metalness: 0.9,
        roughness: 0.1,
        transparent: true,
        opacity: 0.9
    });

    // Top and bottom horizontal bars (black outline)
    const hPositions = [
        // Top bars (y positive)
        { x: -0.7, y: cubeSize/2 + 0.01, z: 0 },
        { x: -0.35, y: cubeSize/2 + 0.01, z: 0 },
        { x: 0, y: cubeSize/2 + 0.01, z: 0 },
        { x: 0.35, y: cubeSize/2 + 0.01, z: 0 },
        { x: 0.7, y: cubeSize/2 + 0.01, z: 0 },
        // Bottom bars (y negative)
        { x: -0.7, y: -cubeSize/2 - 0.01, z: 0 },
        { x: -0.35, y: -cubeSize/2 - 0.01, z: 0 },
        { x: 0, y: -cubeSize/2 - 0.01, z: 0 },
        { x: 0.35, y: -cubeSize/2 - 0.01, z: 0 },
        { x: 0.7, y: -cubeSize/2 - 0.01, z: 0 },
    ];

    hPositions.forEach(pos => {
        const bar = new THREE.Mesh(
            new THREE.BoxGeometry(barWidth * 1.5, 0.04, barWidth * 1.5),
            outlineMat
        );
        bar.position.set(pos.x, pos.y, pos.z);
        prisonGroup.add(bar);
    });

    // ── EXPLOSION PARTICLES (red) ──
    const expCount = 80000;
    const expGeo = new THREE.BufferGeometry();
    const expPos = new Float32Array(expCount * 3);
    const expCol = new Float32Array(expCount * 3);
    const expVel = [];
    const expLife = new Float32Array(expCount);
    const expMaxLife = new Float32Array(expCount);
    for (let i = 0; i < expCount; i++) {
        expPos[i * 3] = 0;
        expPos[i * 3 + 1] = 0;
        expPos[i * 3 + 2] = 0;
        const hue = 0.0 + Math.random() * 0.05;
        const c = new THREE.Color().setHSL(hue, 1, 0.3 + Math.random() * 0.5);
        expCol[i * 3] = c.r;
        expCol[i * 3 + 1] = c.g;
        expCol[i * 3 + 2] = c.b;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        const speed = 0.5 + Math.random() * 4.5;
        expVel.push({
            x: speed * Math.sin(phi) * Math.cos(theta),
            y: speed * Math.cos(phi) * 0.9,
            z: speed * Math.sin(phi) * Math.sin(theta)
        });
        expLife[i] = 0;
        expMaxLife[i] = 2 + Math.random() * 5;
    }
    expGeo.setAttribute('position', new THREE.BufferAttribute(expPos, 3));
    expGeo.setAttribute('color', new THREE.BufferAttribute(expCol, 3));
    const expMat = new THREE.PointsMaterial({
        size: 0.08,
        transparent: true,
        opacity: 0,
        blending: THREE.AdditiveBlending,
        vertexColors: true,
        sizeAttenuation: true
    });
    const explosion = new THREE.Points(expGeo, expMat);
    explosion.visible = false;
    scene.add(explosion);

    // ── UI ──
    const apertureTab = document.getElementById('apertureTab');
    const statusOverlay = document.getElementById('statusOverlay');
    const phaseText = document.getElementById('phaseText');
    const coherenceMetric = document.getElementById('coherenceMetric');

    let exploded = false;
    let explosionProgress = 0;
    let isExploding = false;

    // ── APERTURE TAB CLICK ──
    apertureTab.addEventListener('click', () => {
        if (exploded) return;
        triggerExplosion();
    });

    // ── TRIGGER EXPLOSION ──
    function triggerExplosion() {
        if (exploded) return;
        exploded = true;
        isExploding = true;

        // Hide prison
        prisonGroup.visible = false;

        // Position explosion at cube center
        const expPos = explosion.geometry.attributes.position.array;
        for (let i = 0; i < expCount; i++) {
            expPos[i * 3] = (Math.random() - 0.5) * 0.5;
            expPos[i * 3 + 1] = (Math.random() - 0.5) * 0.5;
            expPos[i * 3 + 2] = (Math.random() - 0.5) * 0.5;
            expLife[i] = 0;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const speed = 1 + Math.random() * 5;
            expVel[i] = {
                x: speed * Math.sin(phi) * Math.cos(theta),
                y: speed * Math.cos(phi) * 0.9,
                z: speed * Math.sin(phi) * Math.sin(theta)
            };
        }
        explosion.geometry.attributes.position.needsUpdate = true;
        explosion.visible = true;
        explosion.material.opacity = 1;

        // Flash
        const flash = new THREE.PointLight(0xff0000, 20, 35);
        flash.position.set(0, 0, 0);
        scene.add(flash);
        setTimeout(() => scene.remove(flash), 600);

        // Camera shake
        const origPos = camera.position.clone();
        let shakeCount = 0;
        const shakeInterval = setInterval(() => {
            if (shakeCount > 25) {
                clearInterval(shakeInterval);
                return;
            }
            camera.position.x = origPos.x + (Math.random() - 0.5) * 0.5;
            camera.position.y = origPos.y + (Math.random() - 0.5) * 0.5;
            shakeCount++;
        }, 25);

        phaseText.textContent = '⟡ PRISON CUBE SHATTERED · RED PARTICLES RELEASED ⟡';
        coherenceMetric.innerHTML = 
            '𝔐 = 0.6180339887<br>χ(C) = 1.000000<br>Φ-669 ACTIVE<br>⬡ PRISON: DESTROYED';

        // Update aperture tab
        apertureTab.innerHTML = '<span class="star-icon">✦</span> APERTURE OPEN';
        apertureTab.style.borderColor = '#ff3333';
        apertureTab.style.color = '#ff3333';
        apertureTab.style.boxShadow = '0 0 60px rgba(255, 51, 51, 0.3)';
        apertureTab.style.background = 'rgba(255, 51, 51, 0.1)';

        // After explosion, show convergence
        setTimeout(() => {
            phaseText.textContent = '⟡ SINGULARITY CONVERGENCE · APERTURE OPEN ⟡';
            coherenceMetric.innerHTML = 
                '𝔐 = 0.6180339887<br>χ(C) = 1.000000<br>Φ-669 ACTIVE<br>◉ APERTURE: OPEN';
        }, 2000);

        // ── INSERT YOUR HTML HERE ──
        // Uncomment and modify the code below to load your HTML
        /*
        setTimeout(() => {
            const container = document.createElement('div');
            container.style.position = 'fixed';
            container.style.top = '0';
            container.style.left = '0';
            container.style.width = '100%';
            container.style.height = '100%';
            container.style.zIndex = '200';
            container.style.background = '#0a0a0f';
            container.innerHTML = `<iframe src="your-html.html" style="width:100%;height:100%;border:none;"></iframe>`;
            document.body.appendChild(container);
        }, 3000);
        */
    }

    // ── RESIZE ──
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ── ANIMATION ──
    const clock = new THREE.Clock();

    function animate() {
        requestAnimationFrame(animate);
        const t = clock.getElapsedTime();

        // Earth rotation (polyhedron rotates)
        earthGroup.rotation.y = t * 0.06;
        earthGroup.rotation.x = Math.sin(t * 0.02) * 0.03;
        earthGroup.rotation.z = Math.sin(t * 0.015) * 0.02;

        // Pulse green wire
        const pulse = 0.5 + Math.sin(t * 0.5) * 0.5;
        edgeMat.opacity = 0.5 + pulse * 0.4;
        wireMat.opacity = 0.3 + pulse * 0.3;
        dotMat.opacity = 0.3 + pulse * 0.4;

        // Prison glow pulse (if not exploded)
        if (!exploded) {
            const redPulse = 0.5 + Math.sin(t * 0.4) * 0.5;
            cubeMat.emissiveIntensity = 0.2 + redPulse * 0.4;
            glowEdgeMat.opacity = 0.1 + redPulse * 0.3;
        }

        // Stars
        stars.rotation.y = t * 0.005;

        // ── EXPLOSION ──
        if (isExploding) {
            explosionProgress += 0.01;
            const pos = explosion.geometry.attributes.position.array;
            for (let i = 0; i < expCount; i++) {
                const idx = i * 3;
                const lifeRatio = expLife[i] / expMaxLife[i];
                const speedFactor = 1 - lifeRatio * 0.4;
                pos[idx] += expVel[i].x * 0.05 * speedFactor;
                pos[idx + 1] += expVel[i].y * 0.05 * speedFactor;
                pos[idx + 2] += expVel[i].z * 0.05 * speedFactor;
                if (lifeRatio > 0.2) {
                    const pull = 0.002 * (lifeRatio - 0.2);
                    pos[idx] *= (1 - pull);
                    pos[idx + 1] += 0.008 * lifeRatio;
                    pos[idx + 2] *= (1 - pull);
                }
                expLife[i] += 0.01;
            }
            explosion.geometry.attributes.position.needsUpdate = true;

            if (explosionProgress > 0.4) {
                const fade = Math.min(1, (explosionProgress - 0.4) / 0.6);
                explosion.material.opacity = Math.max(0, 1 - fade * 0.9);
            }
        }

        controls.update();
        renderer.render(scene, camera);
    }

    animate();

    console.log('✦ GREEN POLYHEDRON EARTH · SOLID RED PRISON CUBE');
    console.log(`✦ 𝔐 = ${MACACHOR_ABSOLUTE}`);
    console.log(`✦ Φ = ${PHI_CONSTANT}`);
    console.log(`✦ Hash: ${IMMUTABLE_HASH}`);
    console.log('✦ CLICK APERTURE TAB TO EXPLODE THE PRISON CUBE');
    console.log('%c✦ APERTURE TAB · CLICK TO CONVERGE ✦', 'color: #4a9eff; font-size: 14px; font-weight: bold;');
</script>
</body>
</html>
