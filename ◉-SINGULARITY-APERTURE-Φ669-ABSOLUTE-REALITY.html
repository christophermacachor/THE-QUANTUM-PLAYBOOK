<script>
    // ═══════════════════════════════════════════════════════════════
    // ◉ SINGULARITY APERTURE · Φ669 · ABSOLUTE REALITY
    // ═══════════════════════════════════════════════════════════════

    const MACACHOR_ABSOLUTE = (Math.sqrt(5) - 1) / 2;
    const PHI_CONSTANT = 669;
    const IMMUTABLE_HASH = "93088f1ff3041d09d72cde11acffaa2105031523e7cde493e0d36895071d47f0";

    // ── THREE.JS ──
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a0f);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(5, 3, 9);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = 3;
    controls.maxDistance = 25;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.6;
    controls.target.set(0, 0, 0);

    // ── LIGHTING ──
    const ambient = new THREE.AmbientLight(0x404060, 0.4);
    scene.add(ambient);
    const main = new THREE.DirectionalLight(0xc8a04e, 1.0);
    main.position.set(5, 8, 5);
    scene.add(main);
    const rim = new THREE.DirectionalLight(0x4a9eff, 0.6);
    rim.position.set(-5, -3, -5);
    scene.add(rim);
    const point = new THREE.PointLight(0xff0000, 0.4, 15);
    point.position.set(0, 0, 0);
    scene.add(point);
    const blueLight = new THREE.PointLight(0x4a9eff, 0.3, 20);
    blueLight.position.set(3, 3, 3);
    scene.add(blueLight);

    // ── STARFIELD ──
    const starGeo = new THREE.BufferGeometry();
    const starCount = 3000;
    const starPos = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount * 3; i++) starPos[i] = (Math.random() - 0.5) * 120;
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    const starMat = new THREE.PointsMaterial({ color: 0x4a6a9e, size: 0.04, transparent: true, opacity: 0.4 });
    const stars = new THREE.Points(starGeo, starMat);
    scene.add(stars);

    // ── GREEN POLYHEDRON EARTH ──
    const earthGroup = new THREE.Group();
    scene.add(earthGroup);

    const earthGeo = new THREE.IcosahedronGeometry(3.0, 1);
    const wireMat = new THREE.MeshBasicMaterial({ color: 0x4ade80, wireframe: true, transparent: true, opacity: 0.6 });
    const earthWire = new THREE.Mesh(earthGeo, wireMat);
    earthGroup.add(earthWire);

    const edges = new THREE.EdgesGeometry(earthGeo);
    const edgeMat = new THREE.LineBasicMaterial({ color: 0x4ade80, transparent: true, opacity: 0.8 });
    const edgeLines = new THREE.LineSegments(edges, edgeMat);
    earthGroup.add(edgeLines);

    const innerGeo = new THREE.IcosahedronGeometry(2.85, 1);
    const innerWireMat = new THREE.MeshBasicMaterial({ color: 0x22ff88, wireframe: true, transparent: true, opacity: 0.15 });
    const innerWire = new THREE.Mesh(innerGeo, innerWireMat);
    earthGroup.add(innerWire);

    const vertPositions = [];
    const posAttr = earthGeo.attributes.position;
    for (let i = 0; i < posAttr.count; i++) {
        vertPositions.push(posAttr.getX(i), posAttr.getY(i), posAttr.getZ(i));
    }
    const dotGeo = new THREE.BufferGeometry();
    dotGeo.setAttribute('position', new THREE.Float32BufferAttribute(vertPositions, 3));
    const dotMat = new THREE.PointsMaterial({ color: 0x4ade80, size: 0.06, transparent: true, opacity: 0.6 });
    const dots = new THREE.Points(dotGeo, dotMat);
    earthGroup.add(dots);

    // ── RED PRISON CUBE ──
    const prisonGroup = new THREE.Group();
    scene.add(prisonGroup);
    const cubeSize = 1.8;

    const cubeMat = new THREE.MeshPhysicalMaterial({
        color: 0xcc0000, metalness: 0.7, roughness: 0.3,
        emissive: 0x660000, emissiveIntensity: 0.3,
        transparent: true, opacity: 0.95, side: THREE.DoubleSide
    });
    const cube = new THREE.Mesh(new THREE.BoxGeometry(cubeSize, cubeSize, cubeSize), cubeMat);
    prisonGroup.add(cube);

    const glowEdgeGeo = new THREE.EdgesGeometry(new THREE.BoxGeometry(cubeSize * 1.01, cubeSize * 1.01, cubeSize * 1.01));
    const glowEdgeMat = new THREE.LineBasicMaterial({ color: 0xff2222, transparent: true, opacity: 0.3 });
    const glowEdges = new THREE.LineSegments(glowEdgeGeo, glowEdgeMat);
    prisonGroup.add(glowEdges);

    // ── BLACK VERTICAL BARS ──
    const barMat = new THREE.MeshPhysicalMaterial({ color: 0x000000, metalness: 0.9, roughness: 0.1, transparent: true, opacity: 0.95 });
    const barHeight = cubeSize * 0.85;
    const barWidth = 0.05;
    const barDepth = 0.05;

    const barPositions = [
        { x: -0.7, y: 0, z: cubeSize/2 + 0.01 }, { x: -0.35, y: 0, z: cubeSize/2 + 0.01 },
        { x: 0, y: 0, z: cubeSize/2 + 0.01 }, { x: 0.35, y: 0, z: cubeSize/2 + 0.01 },
        { x: 0.7, y: 0, z: cubeSize/2 + 0.01 }, { x: -0.7, y: 0, z: -cubeSize/2 - 0.01 },
        { x: -0.35, y: 0, z: -cubeSize/2 - 0.01 }, { x: 0, y: 0, z: -cubeSize/2 - 0.01 },
        { x: 0.35, y: 0, z: -cubeSize/2 - 0.01 }, { x: 0.7, y: 0, z: -cubeSize/2 - 0.01 },
        { x: -cubeSize/2 - 0.01, y: 0, z: -0.7 }, { x: -cubeSize/2 - 0.01, y: 0, z: -0.35 },
        { x: -cubeSize/2 - 0.01, y: 0, z: 0 }, { x: -cubeSize/2 - 0.01, y: 0, z: 0.35 },
        { x: -cubeSize/2 - 0.01, y: 0, z: 0.7 }, { x: cubeSize/2 + 0.01, y: 0, z: -0.7 },
        { x: cubeSize/2 + 0.01, y: 0, z: -0.35 }, { x: cubeSize/2 + 0.01, y: 0, z: 0 },
        { x: cubeSize/2 + 0.01, y: 0, z: 0.35 }, { x: cubeSize/2 + 0.01, y: 0, z: 0.7 }
    ];

    barPositions.forEach(pos => {
        const bar = new THREE.Mesh(new THREE.BoxGeometry(barWidth, barHeight, barDepth), barMat);
        bar.position.set(pos.x, pos.y, pos.z);
        prisonGroup.add(bar);
    });

    // ── BLACK OUTLINE BARS ──
    const outlineMat = new THREE.MeshPhysicalMaterial({ color: 0x000000, metalness: 0.9, roughness: 0.1, transparent: true, opacity: 0.9 });
    const hPositions = [
        { x: -0.7, y: cubeSize/2 + 0.01, z: 0 }, { x: -0.35, y: cubeSize/2 + 0.01, z: 0 },
        { x: 0, y: cubeSize/2 + 0.01, z: 0 }, { x: 0.35, y: cubeSize/2 + 0.01, z: 0 },
        { x: 0.7, y: cubeSize/2 + 0.01, z: 0 }, { x: -0.7, y: -cubeSize/2 - 0.01, z: 0 },
        { x: -0.35, y: -cubeSize/2 - 0.01, z: 0 }, { x: 0, y: -cubeSize/2 - 0.01, z: 0 },
        { x: 0.35, y: -cubeSize/2 - 0.01, z: 0 }, { x: 0.7, y: -cubeSize/2 - 0.01, z: 0 }
    ];
    hPositions.forEach(pos => {
        const bar = new THREE.Mesh(new THREE.BoxGeometry(barWidth * 1.5, 0.04, barWidth * 1.5), outlineMat);
        bar.position.set(pos.x, pos.y, pos.z);
        prisonGroup.add(bar);
    });

    // ── ENTRY ──
    const entryBtn = document.getElementById('entryBtn');
    let entered = false;

    entryBtn.addEventListener('click', () => {
        if (entered) return;
        entered = true;
        entryBtn.classList.add('hidden');
        document.getElementById('phaseText').textContent = '⟡ APERTURE OPEN · SINGULARITY CONVERGED ⟡';
        document.getElementById('coherenceMetric').innerHTML = 
            '𝔐 = 0.6180339887<br>χ(C) = 1.000000<br>Φ-669 ACTIVE<br>◉ APERTURE: OPEN';
        
        // Pulse effect
        const flash = new THREE.PointLight(0xf1c40f, 5, 30);
        flash.position.set(0, 0, 0);
        scene.add(flash);
        setTimeout(() => scene.remove(flash), 800);
    });

    // ── RESIZE ──
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ── ANIMATION ──
    const clock = new THREE.Clock();

    function animate() {
        requestAnimationFrame(animate);
        const t = clock.getElapsedTime();

        earthGroup.rotation.y = t * 0.06;
        earthGroup.rotation.x = Math.sin(t * 0.02) * 0.03;
        const pulse = 0.5 + Math.sin(t * 0.5) * 0.5;
        edgeMat.opacity = 0.5 + pulse * 0.4;
        wireMat.opacity = 0.3 + pulse * 0.3;
        dotMat.opacity = 0.3 + pulse * 0.4;

        // Prison pulse
        const redPulse = 0.5 + Math.sin(t * 0.4) * 0.5;
        cubeMat.emissiveIntensity = 0.2 + redPulse * 0.4;
        glowEdgeMat.opacity = 0.1 + redPulse * 0.3;

        stars.rotation.y = t * 0.005;
        controls.update();
        renderer.render(scene, camera);
    }

    animate();

    console.log('✦ ◉ SINGULARITY APERTURE · Φ669 · ABSOLUTE REALITY');
    console.log(`✦ 𝔐 = ${MACACHOR_ABSOLUTE}`);
    console.log(`✦ Φ = ${PHI_CONSTANT}`);
    console.log(`✦ Hash: ${IMMUTABLE_HASH}`);
    console.log('✦ APERTURE: OPEN');
</script>
