<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platonic Earth Geometry · Vortex Descent</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0f;
            color: #e8dcc8;
            overflow: hidden;
            cursor: default;
        }
        #canvas-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }
        #ui-layer {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10;
            pointer-events: none;
        }
        #ui-layer > * { pointer-events: auto; }

        .title-bar {
            position: absolute;
            top: 20px; left: 50%;
            transform: translateX(-50%);
            text-align: center;
            background: rgba(10, 10, 15, 0.85);
            border: 1px solid #c8a04e;
            border-radius: 8px;
            padding: 10px 24px;
            backdrop-filter: blur(8px);
            z-index: 20;
            transition: opacity 0.8s ease;
        }
        .title-bar h1 {
            color: #c8a04e;
            font-size: 1.2rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 2px;
        }
        .title-bar .subtitle {
            color: #8a7a5a;
            font-size: 0.65rem;
            letter-spacing: 2px;
        }

        .tetrahedron-entry {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 10, 15, 0.9);
            border: 2px solid #c8a04e;
            border-radius: 60px;
            padding: 14px 36px;
            backdrop-filter: blur(12px);
            cursor: pointer;
            transition: all 0.5s ease;
            z-index: 30;
            text-align: center;
            box-shadow: 0 0 30px rgba(200, 160, 78, 0.15);
        }
        .tetrahedron-entry:hover {
            background: rgba(200, 160, 78, 0.15);
            box-shadow: 0 0 50px rgba(200, 160, 78, 0.3);
            transform: translateX(-50%) scale(1.05);
        }
        .tetrahedron-entry .entry-label {
            font-size: 0.8rem;
            color: #c8a04e;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: bold;
        }
        .tetrahedron-entry .entry-sub {
            font-size: 0.6rem;
            color: #8a7a5a;
            letter-spacing: 2px;
            margin-top: 2px;
        }
        .tetrahedron-entry .tetra-icon {
            font-size: 1.8rem;
            display: block;
            margin-bottom: 4px;
        }

        .face-panel {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 240px;
            max-height: 60vh;
            overflow-y: auto;
            background: rgba(10, 10, 15, 0.9);
            border: 1px solid #c8a04e44;
            border-radius: 10px;
            padding: 12px;
            backdrop-filter: blur(12px);
            opacity: 0;
            transition: opacity 0.8s ease, transform 0.8s ease;
            transform: translateY(-50%) translateX(20px);
            pointer-events: none;
            z-index: 15;
        }
        .face-panel.visible {
            opacity: 1;
            transform: translateY(-50%) translateX(0);
            pointer-events: auto;
        }
        .face-panel h2 {
            color: #c8a04e;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
            text-align: center;
            border-bottom: 1px solid #c8a04e33;
            padding-bottom: 6px;
        }
        .face-item {
            display: flex;
            align-items: center;
            padding: 5px 8px;
            margin: 2px 0;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid transparent;
            font-size: 0.7rem;
        }
        .face-item:hover {
            background: rgba(200, 160, 78, 0.1);
            border-color: #c8a04e44;
        }
        .face-item.active {
            background: rgba(200, 160, 78, 0.2);
            border-color: #c8a04e;
        }
        .face-number {
            width: 20px; height: 20px;
            border-radius: 50%;
            background: #c8a04e22;
            border: 1px solid #c8a04e;
            color: #c8a04e;
            font-size: 0.6rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 8px;
            flex-shrink: 0;
        }
        .face-label {
            font-size: 0.65rem;
            color: #c8c0a8;
            letter-spacing: 0.5px;
        }

        .face-panel::-webkit-scrollbar { width: 3px; }
        .face-panel::-webkit-scrollbar-track { background: transparent; }
        .face-panel::-webkit-scrollbar-thumb { background: #c8a04e44; border-radius: 2px; }

        .info-panel {
            position: absolute;
            bottom: 100px; left: 20px;
            background: rgba(10, 10, 15, 0.85);
            border: 1px solid #c8a04e44;
            border-radius: 8px;
            padding: 10px 14px;
            backdrop-filter: blur(8px);
            max-width: 240px;
            opacity: 0;
            transition: opacity 0.6s ease;
            z-index: 15;
            pointer-events: none;
            font-size: 0.8rem;
        }
        .info-panel.visible {
            opacity: 1;
            pointer-events: auto;
        }
        .info-panel .selected-face { color: #c8a04e; font-weight: bold; margin-bottom: 2px; }
        .info-panel .face-url { color: #6a9eff; font-size: 0.6rem; word-break: break-all; margin-bottom: 4px; }
        .info-panel .face-type {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: #c8a04e22;
            border: 1px solid #c8a04e55;
            color: #c8a04e;
        }
        .info-panel .navigate-btn {
            margin-top: 6px;
            padding: 4px 12px;
            background: #c8a04e;
            color: #0a0a0f;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.65rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s;
        }
        .navigate-btn:hover {
            background: #d8b05e;
            box-shadow: 0 0 12px rgba(200, 160, 78, 0.4);
        }

        .controls-hint {
            position: absolute;
            bottom: 20px; right: 20px;
            background: rgba(10, 10, 15, 0.7);
            border: 1px solid #c8a04e22;
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 0.55rem;
            color: #8a7a5a;
            line-height: 1.5;
            opacity: 0;
            transition: opacity 0.8s ease;
            z-index: 15;
        }
        .controls-hint.visible { opacity: 1; }

        .vortex-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 5;
            background: radial-gradient(circle at center, transparent 30%, rgba(10, 10, 15, 0.8) 100%);
            opacity: 0;
            transition: opacity 1.5s ease;
        }
        .vortex-overlay.active { opacity: 1; }

        /* Descent status */
        .descent-status {
            position: absolute;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            color: #c8a04e;
            font-size: 0.8rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            opacity: 0;
            transition: opacity 0.5s ease;
            z-index: 25;
            text-shadow: 0 0 20px rgba(200,160,78,0.3);
            pointer-events: none;
            text-align: center;
            font-family: 'Courier New', monospace;
        }
        .descent-status.visible { opacity: 1; }
        .descent-status .solid-name {
            color: #ffd700;
            font-size: 1.2rem;
            display: block;
            margin-top: 4px;
        }

        @media (max-width: 768px) {
            .face-panel { width: 180px; right: 10px; padding: 8px; }
            .face-number { width: 16px; height: 16px; font-size: 0.5rem; }
            .face-label { font-size: 0.55rem; }
            .title-bar h1 { font-size: 0.9rem; }
            .tetrahedron-entry { padding: 8px 16px; bottom: 20px; }
            .tetrahedron-entry .entry-label { font-size: 0.6rem; }
            .info-panel { max-width: 160px; left: 10px; bottom: 70px; font-size: 0.7rem; }
            .controls-hint { display: none; }
            .descent-status { font-size: 0.6rem; bottom: 80px; }
            .descent-status .solid-name { font-size: 0.9rem; }
        }
    </style>
</head>
<body>

<div id="canvas-container"></div>
<div class="vortex-overlay" id="vortexOverlay"></div>

<div id="ui-layer">

    <div class="title-bar" id="titleBar">
        <h1>Platonic Earth Geometry</h1>
        <div class="subtitle">Vortex Descent · Core Convergence</div>
    </div>

    <div class="tetrahedron-entry" id="tetraEntry">
        <span class="tetra-icon">⬡</span>
        <div class="entry-label">Touch a Tetrahedron</div>
        <div class="entry-sub">Enter the Vortex · Descend to Earth</div>
    </div>

    <div class="descent-status" id="descentStatus">
        <span id="descentPhase">Initiating Descent...</span>
        <span class="solid-name" id="solidDisplay">⬡</span>
    </div>

    <div class="face-panel" id="facePanel">
        <h2>Faces of Coherence</h2>
        <div id="faceList"></div>
    </div>

    <div class="info-panel" id="infoPanel">
        <div class="selected-face" id="selectedFace">Select a face</div>
        <div class="face-url" id="faceUrl">—</div>
        <div class="face-type" id="faceType">—</div>
        <button class="navigate-btn" id="navigateBtn" style="display:none;">Navigate</button>
    </div>

    <div class="controls-hint" id="controlsHint">
        Left Click · Select Face<br>
        Drag · Rotate · Scroll · Zoom
    </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
// PLATONIC EARTH GEOMETRY — VORTEX DESCENT
// 16-Face Coherence Sphere → Vortex → Earth Core → Cube
// ═══════════════════════════════════════════════════════════════

const POLYHEDRON_FACES = [
  { seq: 1,  label: "RESONANT HARMONY",    url: "RESONANT HARMONY.html",                  type: "internal" },
  { seq: 2,  label: "ILLUSIONS",           url: "illusions.html",                         type: "internal" },
  { seq: 3,  label: "KARDASHEV COMPLETE",  url: "kardashev-complete.html",                type: "internal" },
  { seq: 4,  label: "SPACE FOR LEASE",     url: "leased_space_doctrine_standalone.html",  type: "internal" },
  { seq: 5,  label: "MILESTONE",           url: "mesh-codex-milestone.html",              type: "internal" },
  { seq: 6,  label: "MESH",                url: "mesh.html",                              type: "internal" },
  { seq: 7,  label: "OLINTO DE PRETTO",    url: "olinto_de_pretto.html",                  type: "internal" },
  { seq: 8,  label: "-Ω∞ ANALYSIS",        url: "omega-empirical-analysis.html",          type: "internal" },
  { seq: 9,  label: "-Ω∞ STARS",           url: "star-identification.html",               type: "internal" },
  { seq: 10, label: "LIVE SATELLITES",     url: "satellite.html",                         type: "internal" },
  { seq: 11, label: "ENERGY",              url: "tetrahedral-spiral-madl.html",           type: "internal" },
  { seq: 12, label: "FEDERATION",          url: "federation-root-unified.html",           type: "internal" },
  { seq: 13, label: "COHERENCE",           url: "coherence-frequency-ontology.html",      type: "internal" },
  { seq: 14, label: "NOAA GATEWAY",        url: "https://noaa.macachor.org/",             type: "external" },
  { seq: 15, label: "THE SINGULARITY",     url: "Ω-PRIME.html",                           type: "singularity" },
  { seq: 16, label: "M COHERENCE",         url: "m-invariant-hardware-specification.html", type: "attachment" }
];

const PLATONIC_SOLIDS = [
    { name: 'Tetrahedron', icon: '⬡', color: 0xe74c3c, faces: 4 },
    { name: 'Octahedron', icon: '◇', color: 0x3498db, faces: 8 },
    { name: 'Cube', icon: '▣', color: 0xf1c40f, faces: 6 },
    { name: 'Dodecahedron', icon: '⬠', color: 0x9b59b6, faces: 12 },
    { name: 'Icosahedron', icon: '⬡', color: 0x1abc9c, faces: 20 }
];

// ── THREE.JS SETUP ──
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0f);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 0, 6);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
document.getElementById('canvas-container').appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.minDistance = 0.5;
controls.maxDistance = 20;
controls.autoRotate = false;

// ── LIGHTING ──
const ambientLight = new THREE.AmbientLight(0x404040, 0.4);
scene.add(ambientLight);

const mainLight = new THREE.DirectionalLight(0xc8a04e, 1.0);
mainLight.position.set(5, 5, 5);
mainLight.castShadow = true;
scene.add(mainLight);

const rimLight = new THREE.DirectionalLight(0x4a9eff, 0.5);
rimLight.position.set(-5, -3, -5);
scene.add(rimLight);

const pointLight = new THREE.PointLight(0xc8a04e, 0.6, 20);
pointLight.position.set(0, 0, 0);
scene.add(pointLight);

// ── STARFIELD ──
const starGeo = new THREE.BufferGeometry();
const starCount = 4000;
const starPos = new Float32Array(starCount * 3);
for (let i = 0; i < starCount * 3; i++) starPos[i] = (Math.random() - 0.5) * 120;
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
const starMat = new THREE.PointsMaterial({ color: 0xc8c0a8, size: 0.04, transparent: true, opacity: 0.6 });
const stars = new THREE.Points(starGeo, starMat);
scene.add(stars);

// ── MAIN POLYHEDRON ──
const polyGeo = new THREE.IcosahedronGeometry(2, 1);
const polyMat = new THREE.MeshPhysicalMaterial({
    color: 0x1a1a2e,
    metalness: 0.7,
    roughness: 0.3,
    clearcoat: 0.5,
    clearcoatRoughness: 0.2,
    emissive: 0x0a0a1a,
    emissiveIntensity: 0.2,
    side: THREE.DoubleSide,
    transparent: true,
    opacity: 1
});
const polyhedron = new THREE.Mesh(polyGeo, polyMat);
polyhedron.castShadow = true;
scene.add(polyhedron);

const wireGeo = new THREE.WireframeGeometry(polyGeo);
const wireMat = new THREE.LineBasicMaterial({ color: 0xc8a04e, transparent: true, opacity: 0.15 });
const wireframe = new THREE.LineSegments(wireGeo, wireMat);
polyhedron.add(wireframe);

// ── FACE MARKERS ──
const faceMeshes = [];
const markerGroup = new THREE.Group();
scene.add(markerGroup);

function getFacePosition(index, total) {
    const phi = Math.acos(1 - 2 * (index + 0.5) / total);
    const theta = Math.PI * (1 + Math.sqrt(5)) * (index + 0.5);
    const r = 2.15;
    return new THREE.Vector3(r * Math.sin(phi) * Math.cos(theta), r * Math.sin(phi) * Math.sin(theta), r * Math.cos(phi));
}

POLYHEDRON_FACES.forEach((face, index) => {
    const pos = getFacePosition(index, POLYHEDRON_FACES.length);
    const marker = new THREE.Mesh(
        new THREE.SphereGeometry(0.07, 16, 16),
        new THREE.MeshPhysicalMaterial({ color: 0xc8a04e, metalness: 0.9, roughness: 0.1, emissive: 0xc8a04e, emissiveIntensity: 0.3 })
    );
    marker.position.copy(pos);
    marker.userData = { seq: face.seq, faceData: face };
    markerGroup.add(marker);
    faceMeshes.push(marker);

    const ring = new THREE.Mesh(
        new THREE.RingGeometry(0.10, 0.13, 32),
        new THREE.MeshBasicMaterial({ color: 0xc8a04e, transparent: true, opacity: 0.25, side: THREE.DoubleSide })
    );
    ring.position.copy(pos);
    ring.lookAt(0, 0, 0);
    markerGroup.add(ring);

    const canvas = document.createElement('canvas');
    canvas.width = 64; canvas.height = 64;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#0a0a0f';
    ctx.fillRect(0, 0, 64, 64);
    ctx.strokeStyle = '#c8a04e';
    ctx.lineWidth = 2;
    ctx.strokeRect(2, 2, 60, 60);
    ctx.fillStyle = '#c8a04e';
    ctx.font = 'bold 28px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(face.seq.toString(), 32, 32);
    const spriteMat = new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas) });
    const sprite = new THREE.Sprite(spriteMat);
    sprite.scale.set(0.22, 0.22, 0.22);
    sprite.position.copy(pos).multiplyScalar(1.08);
    markerGroup.add(sprite);
});

// Connection lines
const lineMat = new THREE.LineBasicMaterial({ color: 0xc8a04e, transparent: true, opacity: 0.08 });
for (let i = 0; i < faceMeshes.length; i++) {
    for (let j = i + 1; j < faceMeshes.length; j++) {
        if (faceMeshes[i].position.distanceTo(faceMeshes[j].position) < 2.0) {
            const line = new THREE.Line(
                new THREE.BufferGeometry().setFromPoints([faceMeshes[i].position, faceMeshes[j].position]),
                lineMat
            );
            markerGroup.add(line);
        }
    }
}

// ── VORTEX PARTICLES ──
const vCount = 2000;
const vGeo = new THREE.BufferGeometry();
const vPos = new Float32Array(vCount * 3);
const vCol = new Float32Array(vCount * 3);
for (let i = 0; i < vCount; i++) {
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    const r = 2 + Math.random() * 8;
    vPos[i*3] = r * Math.sin(phi) * Math.cos(theta);
    vPos[i*3+1] = (Math.random() - 0.5) * 15;
    vPos[i*3+2] = r * Math.sin(phi) * Math.sin(theta);
    const c = new THREE.Color().setHSL(0.1 + Math.random() * 0.1, 0.8, 0.3 + Math.random() * 0.3);
    vCol[i*3] = c.r;
    vCol[i*3+1] = c.g;
    vCol[i*3+2] = c.b;
}
vGeo.setAttribute('position', new THREE.BufferAttribute(vPos, 3));
vGeo.setAttribute('color', new THREE.BufferAttribute(vCol, 3));
const vMat = new THREE.PointsMaterial({
    size: 0.08,
    transparent: true,
    opacity: 0.4,
    blending: THREE.AdditiveBlending,
    vertexColors: true
});
const vortex = new THREE.Points(vGeo, vMat);
vortex.visible = false;
scene.add(vortex);

// ── PLATONIC SOLID OBJECTS (for descent) ──
const solidMeshes = [];
PLATONIC_SOLIDS.forEach((solid, idx) => {
    let geo;
    switch(idx) {
        case 0: geo = new THREE.TetrahedronGeometry(0.6); break;
        case 1: geo = new THREE.OctahedronGeometry(0.6); break;
        case 2: geo = new THREE.BoxGeometry(0.8, 0.8, 0.8); break;
        case 3: geo = new THREE.DodecahedronGeometry(0.6); break;
        case 4: geo = new THREE.IcosahedronGeometry(0.6); break;
    }
    const mat = new THREE.MeshPhysicalMaterial({
        color: solid.color,
        metalness: 0.8,
        roughness: 0.2,
        emissive: solid.color,
        emissiveIntensity: 0.3,
        transparent: true,
        opacity: 0.9
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(0, 30 + idx * 6, 0);
    mesh.userData = { solidIdx: idx, name: solid.name, icon: solid.icon };
    mesh.castShadow = true;
    scene.add(mesh);
    solidMeshes.push(mesh);
});

// ── EARTH CORE CUBE ──
const coreMat = new THREE.MeshPhysicalMaterial({
    color: 0xf1c40f,
    metalness: 0.9,
    roughness: 0.1,
    emissive: 0xf1c40f,
    emissiveIntensity: 0.5,
    transparent: true,
    opacity: 0.95
});
const coreCube = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), coreMat);
coreCube.position.set(0, -25, 0);
coreCube.castShadow = true;
coreCube.visible = false;
scene.add(coreCube);

// ── RAYCASTER ──
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let hoveredSeq = null;
let selectedSeq = null;
let isDescending = false;
let descentProgress = 0;
let descentPhase = 0; // 0=init, 1=vortex, 2=passing solids, 3=landing

// ── UI ──
const faceList = document.getElementById('faceList');
const facePanel = document.getElementById('facePanel');
const infoPanel = document.getElementById('infoPanel');
const controlsHint = document.getElementById('controlsHint');
const vortexOverlay = document.getElementById('vortexOverlay');
const tetraEntry = document.getElementById('tetraEntry');
const descentStatus = document.getElementById('descentStatus');
const descentPhaseEl = document.getElementById('descentPhase');
const solidDisplay = document.getElementById('solidDisplay');
const titleBar = document.getElementById('titleBar');

POLYHEDRON_FACES.forEach(face => {
    const item = document.createElement('div');
    item.className = 'face-item';
    item.dataset.seq = face.seq;
    item.innerHTML = `<div class="face-number">${face.seq}</div><div class="face-label">${face.label}</div>`;
    item.addEventListener('click', () => selectFace(face.seq));
    faceList.appendChild(item);
});

function selectFace(seq) {
    const face = POLYHEDRON_FACES.find(f => f.seq === seq);
    if (!face || isDescending) return;
    selectedSeq = seq;
    document.querySelectorAll('.face-item').forEach(el => {
        el.classList.toggle('active', parseInt(el.dataset.seq) === seq);
    });
    document.getElementById('selectedFace').textContent = face.label;
    document.getElementById('faceUrl').textContent = face.url;
    document.getElementById('faceType').textContent = face.type;
    const btn = document.getElementById('navigateBtn');
    btn.style.display = 'inline-block';
    btn.onclick = () => window.open(face.url, '_blank');
    faceMeshes.forEach(m => {
        m.material.emissiveIntensity = m.userData.seq === seq ? 1.0 : 0.3;
        m.scale.set(m.userData.seq === seq ? 1.5 : 1, m.userData.seq === seq ? 1.5 : 1, m.userData.seq === seq ? 1.5 : 1);
    });
    infoPanel.classList.add('visible');
}

// ── ENTRY: TOUCH A TETRAHEDRON ──
tetraEntry.addEventListener('click', () => {
    if (isDescending) return;
    isDescending = true;
    vortexActive = true;
    facePanel.classList.add('visible');
    controlsHint.classList.add('visible');
    vortex.visible = true;
    vortexOverlay.classList.add('active');
    tetraEntry.style.opacity = '0';
    tetraEntry.style.transform = 'translateX(-50%) scale(0.8)';
    setTimeout(() => { tetraEntry.style.display = 'none'; }, 600);
    descentStatus.classList.add('visible');
    descentPhaseEl.textContent = 'Initiating Descent...';
    solidDisplay.textContent = '⬡';
    // Auto-select face 15
    setTimeout(() => selectFace(15), 300);
});

// ── MOUSE EVENTS ──
function onMouseMove(e) {
    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    if (!facePanel.classList.contains('visible')) return;
    raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObjects(faceMeshes);
    document.querySelectorAll('.face-item').forEach(el => el.style.background = '');
    if (hits.length > 0 && !isDescending) {
        const seq = hits[0].object.userData.seq;
        hoveredSeq = seq;
        document.body.style.cursor = 'pointer';
        document.querySelectorAll('.face-item').forEach(el => {
            if (parseInt(el.dataset.seq) === seq) el.style.background = 'rgba(200,160,78,0.15)';
        });
    } else {
        hoveredSeq = null;
        document.body.style.cursor = 'default';
    }
}

function onClick(e) {
    if (!facePanel.classList.contains('visible') || isDescending) return;
    raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObjects(faceMeshes);
    if (hits.length > 0) selectFace(hits[0].object.userData.seq);
}

window.addEventListener('mousemove', onMouseMove);
window.addEventListener('click', onClick);

// ── RESIZE ──
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

// ── ANIMATION ──
const clock = new THREE.Clock();

function animate() {
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();

    // Polyhedron pulse
    const pulse = 1 + Math.sin(t * 0.5) * 0.02;
    polyhedron.scale.set(pulse, pulse, pulse);

    // Stars
    stars.rotation.y = t * 0.015;

    // ── DESCENT ANIMATION ──
    if (isDescending) {
        descentProgress += 0.003;

        // Phase 1: Collapse polyhedron (0-0.3)
        if (descentProgress < 0.3) {
            const collapse = descentProgress / 0.3;
            const s = 1 - collapse * 0.7;
            polyhedron.scale.set(s, s, s);
            polyhedron.material.opacity = 1 - collapse * 0.7;
            markerGroup.children.forEach(child => {
                if (child.isMesh) child.material.opacity = 1 - collapse * 0.8;
                if (child.isSprite) child.material.opacity = 1 - collapse * 0.8;
            });
            // Spin up vortex
            const spinRate = collapse * 2;
            vortex.rotation.y += spinRate * 0.03;
            vortex.rotation.x += spinRate * 0.01;
            // Camera pull in
            const camDist = 6 - collapse * 4;
            camera.position.z = camDist;
            descentPhaseEl.textContent = 'Collapsing Coherence Sphere...';
        }
        // Phase 2: Vortex tunnel descending (0.3-0.7)
        else if (descentProgress < 0.7) {
            const progress = (descentProgress - 0.3) / 0.4;
            // Move camera down through vortex
            camera.position.y = -progress * 20;
            camera.position.z = 2 + (1 - progress) * 2;
            // Rotate vortex faster
            vortex.rotation.y += 0.05 + progress * 0.1;
            vortex.rotation.x += 0.02;
            // Increase particle speed
            const positions = vortex.geometry.attributes.position.array;
            for (let i = 0; i < positions.length / 3; i++) {
                const idx = i * 3;
                const speed = 0.02 + progress * 0.03;
                positions[idx] += Math.sin(t * 0.5 + i) * speed;
                positions[idx+1] += Math.cos(t * 0.3 + i * 0.7) * speed * 0.5;
                positions[idx+2] += Math.sin(t * 0.4 + i * 1.1) * speed;
            }
            vortex.geometry.attributes.position.needsUpdate = true;

            // Bring Platonic solids into view
            const solidIdx = Math.floor(progress * PLATONIC_SOLIDS.length);
            const solidProgress = (progress * PLATONIC_SOLIDS.length) % 1;
            solidMeshes.forEach((mesh, idx) => {
                const targetY = -5 + idx * 3 - progress * 10;
                mesh.position.y += (targetY - mesh.position.y) * 0.05;
                mesh.rotation.x += 0.02;
                mesh.rotation.y += 0.03;
                if (idx === solidIdx) {
                    mesh.scale.set(1 + solidProgress * 0.5, 1 + solidProgress * 0.5, 1 + solidProgress * 0.5);
                } else {
                    mesh.scale.set(1, 1, 1);
                }
            });

            // Update status
            const solidIndex = Math.min(Math.floor(progress * PLATONIC_SOLIDS.length), PLATONIC_SOLIDS.length - 1);
            const solid = PLATONIC_SOLIDS[solidIndex];
            descentPhaseEl.textContent = `Passing through ${solid.name}...`;
            solidDisplay.textContent = solid.icon;
            solidDisplay.style.color = '#' + solid.color.toString(16).padStart(6, '0');

            // Camera look at center
            controls.target.set(0, -progress * 10, 0);
        }
        // Phase 3: Landing on Cube (0.7-1.0)
        else {
            const progress = (descentProgress - 0.7) / 0.3;
            // Show cube
            coreCube.visible = true;
            const cubeScale = 1 + progress * 2;
            coreCube.scale.set(cubeScale, cubeScale, cubeScale);
            coreCube.rotation.x += 0.01;
            coreCube.rotation.y += 0.02;
            // Final camera position on top of cube
            const camY = -24 + progress * 1.5;
            camera.position.y = camY;
            camera.position.z = 1.5 - progress * 0.5;
            controls.target.set(0, -24 + progress * 0.5, 0);
            // Slow vortex
            vortex.rotation.y += 0.02 * (1 - progress);
            // Solid fade
            solidMeshes.forEach(m => {
                m.material.opacity = Math.max(0, 1 - progress * 2);
            });
            descentPhaseEl.textContent = progress > 0.8 ? 'Landing on Earth Core...' : 'Approaching Cube...';
            solidDisplay.textContent = '▣';
            solidDisplay.style.color = '#f1c40f';

            if (progress > 0.95 && !window._landed) {
                window._landed = true;
                descentPhaseEl.textContent = '✦ You have landed. ✦';
                solidDisplay.textContent = '⬡▣⬡';
                solidDisplay.style.color = '#ffd700';
                // Reveal face panel fully
                facePanel.classList.add('visible');
                infoPanel.classList.add('visible');
                controlsHint.classList.add('visible');
                // Auto-select first face
                setTimeout(() => selectFace(1), 500);
            }
        }

        // Update controls
        controls.update();
    } else {
        // Normal rotation
        markerGroup.rotation.y += 0.002;
    }

    renderer.render(scene, camera);
}

animate();

// ── INIT ──
// Start with polyhedron visible; vortex hidden until entry.
</script>
</body>
