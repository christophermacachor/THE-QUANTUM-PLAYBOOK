<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platonic Earth · Vortex Descent</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0f;
            overflow: hidden;
            cursor: default;
        }
        #canvas-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        /* ── ENTRY BUTTON (clean, no text) ── */
        .entry-btn {
            position: fixed;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            background: rgba(10, 10, 15, 0.7);
            border: 2px solid #c8a04e;
            border-radius: 50%;
            width: 80px;
            height: 80px;
            color: #c8a04e;
            font-size: 2.5rem;
            cursor: pointer;
            transition: all 0.6s ease;
            backdrop-filter: blur(12px);
            box-shadow: 0 0 40px rgba(200, 160, 78, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            font-family: 'Georgia', serif;
            line-height: 1;
        }
        .entry-btn:hover {
            background: rgba(200, 160, 78, 0.15);
            box-shadow: 0 0 60px rgba(200, 160, 78, 0.3);
            transform: translateX(-50%) scale(1.1);
        }
        .entry-btn.hidden {
            opacity: 0;
            pointer-events: none;
            transform: translateX(-50%) scale(0.5);
        }

        @media (max-width: 768px) {
            .entry-btn {
                width: 60px;
                height: 60px;
                font-size: 1.8rem;
                bottom: 30px;
            }
        }
    </style>
</head>
<body>

<div id="canvas-container"></div>

<!-- ── ENTRY BUTTON (tetrahedron symbol) ── -->
<button class="entry-btn" id="entryBtn">⬡</button>

<script>
    // ═══════════════════════════════════════════════════════════════
    // PLATONIC EARTH — CLEAN VORTEX DESCENT
    // No text — pure geometry
    // ═══════════════════════════════════════════════════════════════

    // ── THREE.JS SETUP ──
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a0f);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 6);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = 0.5;
    controls.maxDistance = 20;
    controls.autoRotate = false;

    // ── LIGHTING ──
    const ambient = new THREE.AmbientLight(0x404060, 0.3);
    scene.add(ambient);

    const main = new THREE.DirectionalLight(0xc8a04e, 1.0);
    main.position.set(5, 5, 5);
    scene.add(main);

    const rim = new THREE.DirectionalLight(0x4a9eff, 0.5);
    rim.position.set(-5, -3, -5);
    scene.add(rim);

    const point = new THREE.PointLight(0xc8a04e, 0.6, 20);
    point.position.set(0, 0, 0);
    scene.add(point);

    // ── STARFIELD ──
    const starGeo = new THREE.BufferGeometry();
    const starCount = 4000;
    const starPos = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount * 3; i++) starPos[i] = (Math.random() - 0.5) * 120;
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    const starMat = new THREE.PointsMaterial({ color: 0xc8c0a8, size: 0.04, transparent: true, opacity: 0.5 });
    const stars = new THREE.Points(starGeo, starMat);
    scene.add(stars);

    // ── MAIN ICOSAHEDRON ──
    const icoGeo = new THREE.IcosahedronGeometry(2, 1);
    const icoMat = new THREE.MeshPhysicalMaterial({
        color: 0x1a1a2e,
        metalness: 0.7,
        roughness: 0.3,
        clearcoat: 0.5,
        clearcoatRoughness: 0.2,
        emissive: 0x0a0a1a,
        emissiveIntensity: 0.2,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 1
    });
    const icosahedron = new THREE.Mesh(icoGeo, icoMat);
    scene.add(icosahedron);

    const wireGeo = new THREE.WireframeGeometry(icoGeo);
    const wireMat = new THREE.LineBasicMaterial({ color: 0xc8a04e, transparent: true, opacity: 0.12 });
    const wireframe = new THREE.LineSegments(wireGeo, wireMat);
    icosahedron.add(wireframe);

    // ── VORTEX PARTICLES ──
    const vCount = 2000;
    const vGeo = new THREE.BufferGeometry();
    const vPos = new Float32Array(vCount * 3);
    const vCol = new Float32Array(vCount * 3);
    for (let i = 0; i < vCount; i++) {
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        const r = 2 + Math.random() * 8;
        vPos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
        vPos[i * 3 + 1] = (Math.random() - 0.5) * 15;
        vPos[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
        const c = new THREE.Color().setHSL(0.1 + Math.random() * 0.08, 0.7, 0.3 + Math.random() * 0.3);
        vCol[i * 3] = c.r;
        vCol[i * 3 + 1] = c.g;
        vCol[i * 3 + 2] = c.b;
    }
    vGeo.setAttribute('position', new THREE.BufferAttribute(vPos, 3));
    vGeo.setAttribute('color', new THREE.BufferAttribute(vCol, 3));
    const vMat = new THREE.PointsMaterial({
        size: 0.07,
        transparent: true,
        opacity: 0.3,
        blending: THREE.AdditiveBlending,
        vertexColors: true
    });
    const vortex = new THREE.Points(vGeo, vMat);
    vortex.visible = false;
    scene.add(vortex);

    // ── PLATONIC SOLIDS (for descent) ──
    const solidData = [
        { geo: new THREE.TetrahedronGeometry(0.6), color: 0xe74c3c },
        { geo: new THREE.OctahedronGeometry(0.6), color: 0x3498db },
        { geo: new THREE.BoxGeometry(0.8, 0.8, 0.8), color: 0xf1c40f },
        { geo: new THREE.DodecahedronGeometry(0.6), color: 0x9b59b6 },
        { geo: new THREE.IcosahedronGeometry(0.6), color: 0x1abc9c }
    ];

    const solids = solidData.map((d, idx) => {
        const mat = new THREE.MeshPhysicalMaterial({
            color: d.color,
            metalness: 0.8,
            roughness: 0.2,
            emissive: d.color,
            emissiveIntensity: 0.2,
            transparent: true,
            opacity: 0.85
        });
        const mesh = new THREE.Mesh(d.geo, mat);
        mesh.position.set(0, 30 + idx * 6, 0);
        scene.add(mesh);
        return mesh;
    });

    // ── EARTH CORE CUBE ──
    const coreMat = new THREE.MeshPhysicalMaterial({
        color: 0xf1c40f,
        metalness: 0.9,
        roughness: 0.1,
        emissive: 0xf1c40f,
        emissiveIntensity: 0.5,
        transparent: true,
        opacity: 0.95
    });
    const coreCube = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), coreMat);
    coreCube.position.set(0, -25, 0);
    coreCube.visible = false;
    scene.add(coreCube);

    // ── RING LINES ──
    const ringMat = new THREE.LineBasicMaterial({
        color: 0xc8a04e,
        transparent: true,
        opacity: 0.05
    });
    for (let i = 0; i < 6; i++) {
        const r = 2.5 + i * 0.4;
        const pts = [];
        for (let j = 0; j <= 64; j++) {
            const a = (j / 64) * Math.PI * 2;
            pts.push(new THREE.Vector3(
                r * Math.cos(a),
                Math.sin(a * 0.3 + i * 0.5) * 0.4,
                r * Math.sin(a)
            ));
        }
        const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), ringMat);
        scene.add(line);
    }

    // ── ENTRY ──
    const entryBtn = document.getElementById('entryBtn');
    let entered = false;
    let descentProgress = 0;
    let isDescending = false;

    entryBtn.addEventListener('click', () => {
        if (entered) return;
        entered = true;
        isDescending = true;
        entryBtn.classList.add('hidden');
        vortex.visible = true;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.8;
    });

    // ── RESIZE ──
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ── ANIMATION ──
    const clock = new THREE.Clock();

    function animate() {
        requestAnimationFrame(animate);
        const t = clock.getElapsedTime();

        // Icosahedron pulse
        const pulse = 1 + Math.sin(t * 0.4) * 0.015;
        icosahedron.scale.set(pulse, pulse, pulse);

        // Stars
        stars.rotation.y = t * 0.015;

        // ── DESCENT ──
        if (isDescending) {
            descentProgress += 0.004;

            // Phase 1: Collapse (0-0.3)
            if (descentProgress < 0.3) {
                const collapse = descentProgress / 0.3;
                const s = 1 - collapse * 0.7;
                icosahedron.scale.set(s * pulse, s * pulse, s * pulse);
                icosahedron.material.opacity = 1 - collapse * 0.7;
                const spinRate = collapse * 2;
                vortex.rotation.y += spinRate * 0.03;
                vortex.rotation.x += spinRate * 0.01;
                camera.position.z = 6 - collapse * 4;
            }
            // Phase 2: Tunnel (0.3-0.7)
            else if (descentProgress < 0.7) {
                const progress = (descentProgress - 0.3) / 0.4;
                camera.position.y = -progress * 20;
                camera.position.z = 2 + (1 - progress) * 2;
                vortex.rotation.y += 0.05 + progress * 0.1;
                vortex.rotation.x += 0.02;

                const pos = vortex.geometry.attributes.position.array;
                for (let i = 0; i < pos.length / 3; i++) {
                    const idx = i * 3;
                    const speed = 0.02 + progress * 0.03;
                    pos[idx] += Math.sin(t * 0.5 + i) * speed;
                    pos[idx + 1] += Math.cos(t * 0.3 + i * 0.7) * speed * 0.5;
                    pos[idx + 2] += Math.sin(t * 0.4 + i * 1.1) * speed;
                }
                vortex.geometry.attributes.position.needsUpdate = true;

                solids.forEach((mesh, idx) => {
                    const targetY = -5 + idx * 3 - progress * 10;
                    mesh.position.y += (targetY - mesh.position.y) * 0.06;
                    mesh.rotation.x += 0.02;
                    mesh.rotation.y += 0.03;
                    mesh.material.opacity = 0.85;
                });

                controls.target.set(0, -progress * 10, 0);
            }
            // Phase 3: Landing (0.7-1.0)
            else {
                const progress = (descentProgress - 0.7) / 0.3;
                coreCube.visible = true;
                const cs = 1 + progress * 2.5;
                coreCube.scale.set(cs, cs, cs);
                coreCube.rotation.x += 0.01;
                coreCube.rotation.y += 0.02;

                camera.position.y = -24 + progress * 1.5;
                camera.position.z = 1.5 - progress * 0.5;
                controls.target.set(0, -24 + progress * 0.5, 0);

                vortex.rotation.y += 0.02 * (1 - progress);
                solids.forEach(m => {
                    m.material.opacity = Math.max(0, 1 - progress * 2.5);
                });

                if (progress > 0.95 && !window._landed) {
                    window._landed = true;
                    // Final pulse
                }
            }

            controls.update();
        }

        // Normal rotation
        if (!isDescending) {
            icosahedron.rotation.y += 0.002;
        }

        renderer.render(scene, camera);
    }

    animate();

    console.log('✦ Platonic Earth — Clean Vortex Descent');
    console.log('✦ No text. Pure geometry.');
</script>

</body>
</html>
